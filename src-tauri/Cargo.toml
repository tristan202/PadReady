[package]
name = "padready"
version = "0.0.0"
description = "Gets your samples ready for hardware samplers"
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zip = { version = "9.4.1", default-features = false, features = ["deflate", "time"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
